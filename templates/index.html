<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document Q&amp;A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
    --bg:          #faf9f7;
    --rail:        #f2f0ec;
    --surface:     #ffffff;
    --ink:         #1d2328;
    --ink-soft:    #5c6670;
    --ink-faint:   #949da6;
    --line:        #e3e0da;
    --hover:       #e8e5df;
    --accent:      #1f6657;
    --accent-ink:  #ffffff;
    --bubble:      #eceae5;
    --alert:       #a23b2a;
    --alert-bg:    #fbeeeb;
}

@media (prefers-color-scheme: dark) {
    :root {
        --bg:         #14191e;
        --rail:       #0f1418;
        --surface:    #1b2128;
        --ink:        #e7e5e1;
        --ink-soft:   #a0aab3;
        --ink-faint:  #6c767f;
        --line:       #272f37;
        --hover:      #222a32;
        --bubble:     #232b33;
        --accent:     #4ea58f;
        --accent-ink: #0d1316;
        --alert:      #e08878;
        --alert-bg:   #2d1c19;
    }
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }

body {
    font-family: Inter, system-ui, -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    display: flex;
    overflow: hidden;
}

button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ---------------------------------------------------------- sidebar */

.sidebar {
    width: 268px;
    flex: none;
    background: var(--rail);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    height: 100%;
}

.sidebar.is-hidden { display: none; }

.side-top {
    padding: 12px 12px 8px;
    display: flex;
    align-items: center;
    gap: 6px;
}

.brand {
    flex: 1;
    font-size: 14px;
    font-weight: 600;
    padding-left: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.icon-btn {
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
    border: none;
    background: none;
    border-radius: 6px;
    color: var(--ink-soft);
}

.icon-btn:hover { background: var(--hover); color: var(--ink); }
.icon-btn svg { width: 17px; height: 17px; }

.new-chat {
    margin: 2px 12px 12px;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 11px;
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    text-align: left;
}

.new-chat:hover { background: var(--hover); }
.new-chat svg { width: 15px; height: 15px; flex: none; }

.side-label {
    padding: 4px 18px 6px;
    font-size: 12px;
    color: var(--ink-faint);
}

.chat-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px 12px;
}

.chat-row {
    display: flex;
    align-items: center;
    border-radius: 7px;
    padding-right: 4px;
}

.chat-row:hover,
.chat-row.is-active { background: var(--hover); }

.chat-open {
    flex: 1;
    min-width: 0;
    border: none;
    background: none;
    text-align: left;
    padding: 8px 4px 8px 10px;
    font-size: 13.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.chat-row.is-active .chat-open { font-weight: 500; }

.chat-del {
    flex: none;
    width: 24px;
    height: 24px;
    display: grid;
    place-items: center;
    border: none;
    background: none;
    border-radius: 5px;
    color: var(--ink-faint);
    opacity: 0;
}

.chat-row:hover .chat-del,
.chat-row:focus-within .chat-del { opacity: 1; }

.chat-del:hover { color: var(--alert); background: var(--alert-bg); }
.chat-del svg { width: 14px; height: 14px; }

.list-empty { padding: 8px 10px; font-size: 13px; color: var(--ink-faint); }

/* ---------------------------------------------------------- main */

.main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    height: 100%;
}

.topbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    min-height: 50px;
}

.topbar .title {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.thread {
    flex: 1;
    overflow-y: auto;
    padding: 6px 20px 0;
}

.thread-inner { max-width: 720px; margin: 0 auto; }

.welcome {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding-bottom: 50px;
    gap: 7px;
}

.welcome h1 { font-size: 25px; font-weight: 600; letter-spacing: -0.01em; }
.welcome p { color: var(--ink-soft); font-size: 14.5px; max-width: 42ch; }

/* messages */

.msg { margin-bottom: 26px; }

.msg.user { display: flex; justify-content: flex-end; }

.msg.user .text {
    background: var(--bubble);
    padding: 11px 15px;
    border-radius: 15px 15px 4px 15px;
    max-width: 82%;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.msg.bot .text { white-space: pre-wrap; overflow-wrap: anywhere; }

.msg.bot .text.is-error {
    color: var(--alert);
    background: var(--alert-bg);
    padding: 12px 14px;
    border-radius: 10px;
}

.sources {
    margin-top: 11px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--ink-faint);
}

.chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px;
    background: var(--bubble);
    border-radius: 20px;
    color: var(--ink-soft);
    font-size: 12px;
}

.chip svg { width: 11px; height: 11px; flex: none; }

.dots { display: inline-flex; gap: 4px; align-items: center; height: 22px; }

.dots i {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--ink-faint);
    animation: blink 1.3s ease-in-out infinite;
}

.dots i:nth-child(2) { animation-delay: .18s; }
.dots i:nth-child(3) { animation-delay: .36s; }

@keyframes blink { 0%,70%,100% { opacity:.25 } 35% { opacity:1 } }

/* ---------------------------------------------------------- composer */

.composer { padding: 10px 20px 18px; }

.composer-inner {
    max-width: 720px;
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px 10px 8px 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px -16px rgba(0,0,0,.25);
    transition: border-color .15s;
}

.composer-inner:focus-within { border-color: var(--accent); }

.attached {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 2px 2px 8px;
}

.attached:empty { display: none; }

.att {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 7px 5px 9px;
    background: var(--bubble);
    border-radius: 7px;
    font-size: 12.5px;
    max-width: 230px;
}

.att > span {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.att small { color: var(--ink-faint); flex: none; }

.att button {
    border: none; background: none; padding: 0;
    width: 16px; height: 16px;
    display: grid; place-items: center;
    color: var(--ink-faint); border-radius: 4px; flex: none;
}

.att button:hover { color: var(--alert); }
.att button svg { width: 11px; height: 11px; }

.att.is-busy { opacity: .6; }
.att.is-bad { color: var(--alert); }

#question {
    width: 100%;
    border: none;
    background: none;
    resize: none;
    max-height: 190px;
    padding: 4px 2px 6px;
    line-height: 1.5;
}

#question:focus { outline: none; }
#question::placeholder { color: var(--ink-faint); }

.composer-bar { display: flex; align-items: center; gap: 8px; }

.attach-btn {
    width: 32px; height: 32px;
    display: grid; place-items: center;
    border: 1px solid var(--line);
    background: none;
    border-radius: 8px;
    color: var(--ink-soft);
}

.attach-btn:hover { background: var(--hover); color: var(--ink); }
.attach-btn svg { width: 16px; height: 16px; }

.note {
    flex: 1;
    font-size: 12px;
    color: var(--ink-faint);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

#send {
    width: 32px; height: 32px;
    display: grid; place-items: center;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    border-radius: 8px;
    flex: none;
    transition: opacity .15s;
}

#send:hover:not(:disabled) { opacity: .87; }
#send:disabled { opacity: .35; cursor: default; }
#send svg { width: 16px; height: 16px; }

#fileInput { display: none; }

.drag-mask {
    position: fixed;
    inset: 0;
    z-index: 40;
    background: rgba(31, 102, 87, .07);
    border: 2px dashed var(--accent);
    display: none;
    place-items: center;
    font-size: 15px;
    font-weight: 500;
    color: var(--accent);
}

.drag-mask.is-on { display: grid; }

/* ---------------------------------------------------------- confirm */

.ask-back {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: rgba(12, 18, 22, .45);
    display: none;
    place-items: center;
    padding: 20px;
}

.ask-back.is-open { display: grid; }

.ask {
    background: var(--surface);
    border-radius: 13px;
    width: 100%;
    max-width: 380px;
    padding: 22px;
    box-shadow: 0 20px 50px -20px rgba(0,0,0,.5);
}

.ask h2 { font-size: 16px; font-weight: 600; margin-bottom: 7px; }

.ask p {
    font-size: 14px;
    color: var(--ink-soft);
    margin-bottom: 20px;
    overflow-wrap: anywhere;
}

.ask p b { color: var(--ink); font-weight: 500; }

.ask-row { display: flex; justify-content: flex-end; gap: 9px; }

.ask-row button {
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 14px;
    font-weight: 500;
    border: 1px solid var(--line);
    background: none;
}

.ask-row button:hover { background: var(--hover); }

.ask-row .danger {
    border-color: transparent;
    background: var(--alert);
    color: #fff;
}

.ask-row .danger:hover { opacity: .88; background: var(--alert); }

/* ---------------------------------------------------------- responsive */

.scrim { display: none; }

@media (max-width: 820px) {
    .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 25;
        transform: translateX(-100%);
        transition: transform .2s ease;
    }
    .sidebar.is-open { transform: none; }
    .sidebar.is-hidden { display: flex; }

    .scrim {
        display: block;
        position: fixed; inset: 0;
        background: rgba(10,16,22,.4);
        z-index: 24;
        opacity: 0; pointer-events: none;
        transition: opacity .2s;
    }
    .scrim.is-open { opacity: 1; pointer-events: auto; }

    .thread { padding: 6px 16px 0; }
    .composer { padding: 8px 14px 14px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
    <div class="side-top">
        <div class="brand">Document Q&amp;A</div>
        <button class="icon-btn" id="hideSide" type="button" title="Hide sidebar" aria-label="Hide sidebar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/>
            </svg>
        </button>
    </div>

    <button class="new-chat" id="newChat" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M12 5v14M5 12h14"/>
        </svg>
        New chat
    </button>

    <div class="side-label">Recent</div>
    <div class="chat-list" id="chatList"></div>
</aside>

<div class="scrim" id="scrim"></div>

<main class="main">
    <div class="topbar">
        <button class="icon-btn" id="showSide" type="button" title="Show sidebar" aria-label="Show sidebar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/>
            </svg>
        </button>
        <div class="title" id="chatTitle">New chat</div>
    </div>

    <div class="thread" id="thread">
        <div class="thread-inner" id="threadInner"></div>
    </div>

    <div class="composer">
        <div class="composer-inner">
            <div class="attached" id="attached"></div>
            <textarea id="question" rows="1" placeholder="Ask about your files"></textarea>
            <div class="composer-bar">
                <button class="attach-btn" id="attachBtn" type="button" title="Add a file" aria-label="Add a file">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                </button>
                <div class="note" id="note"></div>
                <button id="send" type="button" title="Send" aria-label="Send">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 19V5M5 12l7-7 7 7"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>
</main>

<input type="file" id="fileInput" multiple accept=".pdf,.txt,.png,.jpg,.jpeg,.docx">

<div class="ask-back" id="askBack">
    <div class="ask" role="dialog" aria-modal="true" aria-labelledby="askTitle">
        <h2 id="askTitle">Delete this chat?</h2>
        <p>Its messages and the files added to it will be removed. <b id="askName"></b></p>
        <div class="ask-row">
            <button type="button" id="askNo">No</button>
            <button type="button" class="danger" id="askYes">Yes, delete</button>
        </div>
    </div>
</div>

<div class="drag-mask" id="dragMask">Drop the file to add it to this chat</div>

<script>
const ICON_FILE  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>';
const ICON_X     = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';
const ICON_TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>';

const el = {
    sidebar:   document.getElementById("sidebar"),
    scrim:     document.getElementById("scrim"),
    hideSide:  document.getElementById("hideSide"),
    showSide:  document.getElementById("showSide"),
    newChat:   document.getElementById("newChat"),
    chatList:  document.getElementById("chatList"),
    chatTitle: document.getElementById("chatTitle"),
    thread:    document.getElementById("thread"),
    inner:     document.getElementById("threadInner"),
    question:  document.getElementById("question"),
    send:      document.getElementById("send"),
    attachBtn: document.getElementById("attachBtn"),
    fileInput: document.getElementById("fileInput"),
    attached:  document.getElementById("attached"),
    note:      document.getElementById("note"),
    dragMask:  document.getElementById("dragMask"),
    askBack:   document.getElementById("askBack"),
    askName:   document.getElementById("askName"),
    askYes:    document.getElementById("askYes"),
    askNo:     document.getElementById("askNo"),
};

let currentChat = null;
let chatFiles = [];

/* ---------------------------------------------------------- helpers */

function scrollDown() {
    el.thread.scrollTop = el.thread.scrollHeight;
}

function isNarrow() {
    return window.matchMedia("(max-width: 820px)").matches;
}

function showWelcome() {
    el.inner.innerHTML =
        '<div class="welcome">' +
        '<h1>Ask your documents</h1>' +
        '<p>Add a file with the plus button, then ask about it. ' +
        'Files belong to the chat they were added in.</p>' +
        '</div>';
}

function clearWelcome() {
    const w = el.inner.querySelector(".welcome");
    if (w) { w.remove(); }
}

/* ---------------------------------------------------------- files */

function updateNote() {
    const n = chatFiles.length;
    el.note.textContent = n
        ? n + (n === 1 ? " file in this chat" : " files in this chat")
        : "No file added yet";
}

function fileCard(doc) {
    const card = document.createElement("div");
    card.className = "att";

    const name = document.createElement("span");
    name.textContent = doc.filename;

    const info = document.createElement("small");
    info.textContent = doc.chunks + " passages";

    const close = document.createElement("button");
    close.type = "button";
    close.title = "Remove " + doc.filename;
    close.setAttribute("aria-label", "Remove " + doc.filename);
    close.innerHTML = ICON_X;
    close.onclick = () => removeFile(doc.doc_id, card);

    card.append(name, info, close);
    return card;
}

function renderFiles() {
    el.attached.innerHTML = "";
    chatFiles.forEach(doc => el.attached.appendChild(fileCard(doc)));
    updateNote();
}

function removeFile(docId, card) {
    fetch("/documents/" + docId, { method: "DELETE" })
        .then(() => {
            chatFiles = chatFiles.filter(d => d.doc_id !== docId);
            card.remove();
            updateNote();
        })
        .catch(() => {});
}

function uploadFiles(files) {
    Array.from(files).forEach(file => {
        const card = document.createElement("div");
        card.className = "att is-busy";

        const name = document.createElement("span");
        name.textContent = file.name;

        const state = document.createElement("small");
        state.textContent = "reading";

        card.append(name, state);
        el.attached.appendChild(card);

        const form = new FormData();
        form.append("file", file);
        if (currentChat) { form.append("chat_id", currentChat); }

        fetch("/upload", { method: "POST", body: form })
            .then(r => r.json().then(data => ({ ok: r.ok, data })))
            .then(res => {
                card.classList.remove("is-busy");

                if (!res.ok) {
                    card.classList.add("is-bad");
                    state.textContent = "could not be read";
                    card.title = res.data.error;
                    setTimeout(() => card.remove(), 5000);
                    return;
                }

                if (!currentChat) {
                    currentChat = res.data.chat_id;
                    loadChats();
                }

                const doc = {
                    doc_id: res.data.doc_id,
                    filename: res.data.filename,
                    chunks: res.data.chunks,
                };
                chatFiles.push(doc);
                card.replaceWith(fileCard(doc));
                updateNote();
            })
            .catch(() => {
                card.classList.remove("is-busy");
                card.classList.add("is-bad");
                state.textContent = "upload failed";
                setTimeout(() => card.remove(), 5000);
            });
    });
}

/* ---------------------------------------------------------- messages */

function addUser(text) {
    const wrap = document.createElement("div");
    wrap.className = "msg user";
    const body = document.createElement("div");
    body.className = "text";
    body.textContent = text;
    wrap.appendChild(body);
    el.inner.appendChild(wrap);
}

function addBot(text, sources, lookedAt, total, failed) {
    const wrap = document.createElement("div");
    wrap.className = "msg bot";

    const body = document.createElement("div");
    body.className = "text" + (failed ? " is-error" : "");
    body.textContent = text;
    wrap.appendChild(body);

    if (!failed && sources && sources.length) {
        const row = document.createElement("div");
        row.className = "sources";

        sources.forEach(name => {
            const chip = document.createElement("span");
            chip.className = "chip";
            chip.innerHTML = ICON_FILE;
            chip.append(document.createTextNode(name));
            row.appendChild(chip);
        });

        if (lookedAt && total) {
            const scope = document.createElement("span");
            scope.textContent = "read " + lookedAt + " of " + total + " passages";
            row.appendChild(scope);
        }

        wrap.appendChild(row);
    }

    el.inner.appendChild(wrap);
}

function addWaiting() {
    const wrap = document.createElement("div");
    wrap.className = "msg bot";
    wrap.innerHTML = '<div class="dots"><i></i><i></i><i></i></div>';
    el.inner.appendChild(wrap);
    scrollDown();
    return wrap;
}

/* ---------------------------------------------------------- chats */

function loadChats() {
    return fetch("/chats")
        .then(r => r.json())
        .then(data => {
            const chats = data.chats || [];
            el.chatList.innerHTML = "";

            if (!chats.length) {
                el.chatList.innerHTML = '<div class="list-empty">No chats yet</div>';
                return;
            }

            chats.forEach(chat => {
                const row = document.createElement("div");
                row.className = "chat-row" + (chat.chat_id === currentChat ? " is-active" : "");

                const open = document.createElement("button");
                open.className = "chat-open";
                open.type = "button";
                open.textContent = chat.title;
                open.title = chat.title + "  ·  " + chat.updated_at;
                open.onclick = () => openChat(chat.chat_id, chat.title);

                const del = document.createElement("button");
                del.className = "chat-del";
                del.type = "button";
                del.title = "Delete this chat";
                del.setAttribute("aria-label", "Delete " + chat.title);
                del.innerHTML = ICON_TRASH;
                del.onclick = e => {
                    e.stopPropagation();
                    confirmDelete(chat.chat_id, chat.title);
                };

                row.append(open, del);
                el.chatList.appendChild(row);
            });
        })
        .catch(() => {});
}

function openChat(chatId, title) {
    currentChat = chatId;
    el.chatTitle.textContent = title || "Chat";
    if (isNarrow()) { toggleSide(false); }

    fetch("/chats/" + chatId)
        .then(r => r.json())
        .then(data => {
            chatFiles = data.files || [];
            renderFiles();

            el.inner.innerHTML = "";
            const list = data.messages || [];

            if (!list.length) {
                showWelcome();
            } else {
                list.forEach(m => {
                    if (m.role === "user") {
                        addUser(m.content);
                    } else {
                        addBot(m.content, m.sources, m.looked_at, m.total, false);
                    }
                });
            }
            scrollDown();
            loadChats();
        })
        .catch(() => {});
}

function startNewChat() {
    currentChat = null;
    chatFiles = [];
    renderFiles();
    el.chatTitle.textContent = "New chat";
    showWelcome();
    loadChats();
    if (isNarrow()) { toggleSide(false); }
    el.question.focus();
}

let pendingDelete = null;

function confirmDelete(chatId, title) {
    pendingDelete = chatId;
    el.askName.textContent = title;
    el.askBack.classList.add("is-open");
    el.askYes.focus();
}

function closeConfirm() {
    pendingDelete = null;
    el.askBack.classList.remove("is-open");
}

function deleteChat(chatId) {
    fetch("/chats/" + chatId, { method: "DELETE" })
        .then(() => {
            if (chatId === currentChat) { startNewChat(); }
            else { loadChats(); }
        })
        .catch(() => {});
}

/* ---------------------------------------------------------- asking */

function ask() {
    const text = el.question.value.trim();
    if (!text) { return; }

    clearWelcome();
    addUser(text);

    el.question.value = "";
    el.question.style.height = "auto";
    el.send.disabled = true;
    scrollDown();

    const waiting = addWaiting();

    fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: text, chat_id: currentChat })
    })
        .then(r => r.json().then(data => ({ ok: r.ok, data })))
        .then(res => {
            waiting.remove();

            if (!res.ok) {
                addBot(res.data.error, [], 0, 0, true);
            } else {
                addBot(res.data.answer, res.data.sources,
                       res.data.looked_at, res.data.total, false);

                if (currentChat !== res.data.chat_id) {
                    currentChat = res.data.chat_id;
                    el.chatTitle.textContent =
                        text.length > 48 ? text.slice(0, 48) + "..." : text;
                }
                loadChats();
            }
            scrollDown();
        })
        .catch(() => {
            waiting.remove();
            addBot("The server did not respond. Check that it is still running, then ask again.",
                   [], 0, 0, true);
            scrollDown();
        })
        .finally(() => {
            el.send.disabled = false;
            el.question.focus();
        });
}

/* ---------------------------------------------------------- wiring */

function toggleSide(open) {
    if (isNarrow()) {
        el.sidebar.classList.toggle("is-open", open);
        el.scrim.classList.toggle("is-open", open);
    } else {
        el.sidebar.classList.toggle("is-hidden", !open);
    }
    el.showSide.style.display = (!isNarrow() && open) ? "none" : "grid";
}

el.hideSide.onclick = () => toggleSide(false);
el.showSide.onclick = () => toggleSide(true);
el.scrim.onclick = () => toggleSide(false);

el.askNo.onclick = closeConfirm;

el.askYes.onclick = () => {
    const id = pendingDelete;
    closeConfirm();
    if (id) { deleteChat(id); }
};

el.askBack.onclick = e => {
    if (e.target === el.askBack) { closeConfirm(); }
};

el.newChat.onclick = startNewChat;
el.send.onclick = ask;

el.attachBtn.onclick = () => el.fileInput.click();
el.fileInput.onchange = () => {
    uploadFiles(el.fileInput.files);
    el.fileInput.value = "";
};

el.question.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        ask();
    }
});

el.question.addEventListener("input", () => {
    el.question.style.height = "auto";
    el.question.style.height = Math.min(el.question.scrollHeight, 190) + "px";
});

document.addEventListener("keydown", e => {
    if (e.key !== "Escape") { return; }
    if (el.askBack.classList.contains("is-open")) {
        closeConfirm();
        return;
    }
    if (isNarrow()) { toggleSide(false); }
});

let dragDepth = 0;

document.addEventListener("dragenter", e => {
    e.preventDefault();
    dragDepth += 1;
    el.dragMask.classList.add("is-on");
});

document.addEventListener("dragover", e => e.preventDefault());

document.addEventListener("dragleave", e => {
    e.preventDefault();
    dragDepth -= 1;
    if (dragDepth <= 0) { el.dragMask.classList.remove("is-on"); }
});

document.addEventListener("drop", e => {
    e.preventDefault();
    dragDepth = 0;
    el.dragMask.classList.remove("is-on");
    if (e.dataTransfer && e.dataTransfer.files.length) {
        uploadFiles(e.dataTransfer.files);
    }
});

window.addEventListener("resize", () => {
    el.showSide.style.display =
        (!isNarrow() && !el.sidebar.classList.contains("is-hidden")) ? "none" : "grid";
});

showWelcome();
updateNote();
toggleSide(!isNarrow());
loadChats();
el.question.focus();
</script>

</body>
</html>
